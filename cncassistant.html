/* Home image slider - directly below the original Home ticker */
.home-bottom-slider{width:100%;overflow:hidden;background:#061018;border-bottom:1px solid var(--l);padding:24px 0 46px;position:relative;clear:both}

.home-bottom-slider:hover .home-bottom-track{animation-play-state:paused}
.bottom-mould-slide{flex:0 0 260px;width:260px;height:180px;min-width:260px;overflow:hidden;border:1px solid #294752;background:#07131b}

 .home-second-slider{padding:18px 0 38px}

/* Contact section readability */
footer#contact .foot{
  gap:55px;
}
footer#contact .foot > div{
  min-width:0;
}
footer#contact .foot > div > b{
  display:block;
  color:#dcebf0;
  font:800 14px/1.2 Inter,Arial,sans-serif;
  letter-spacing:.12em;
  margin-bottom:14px;
}
footer#contact .foot p{
  font-size:14px !important;
  line-height:1.6;
}
footer#contact .foot a{
  color:#b6c9d0;
  font-size:15px;
  line-height:1.5;
  margin:10px 0;
}
footer#contact .foot a:hover{
  color:var(--a);
}
footer#contact .logo{
  font-size:16px;
}
footer#contact .logo small{
  font-size:9px !important;
}
@media(max-width:560px){
  footer#contact .foot > div > b{font-size:13px}
  footer#contact .foot p{font-size:14px !important}
  footer#contact .foot a{font-size:15px}
}

/* Professional contact profile */
footer#contact .contact-profile{
  display:flex;
  align-items:center;
  gap:20px;
  min-width:300px;
  max-width:390px;
}
footer#contact .contact-profile img{
  width:125px;
  height:125px;
  flex:0 0 125px;
  object-fit:cover;
  object-position:center top;
  border:1px solid #2b5969;
  border-radius:8px;
  box-shadow:0 14px 35px rgba(0,0,0,.35);
}
footer#contact .contact-profile-kicker{
  color:var(--a);
  font:800 11px/1.4 monospace;
  letter-spacing:.14em;
  margin-bottom:8px;
}
footer#contact .contact-profile-title{
  color:#e8f3f6;
  font:800 18px/1.25 Inter,Arial,sans-serif;
  margin-bottom:9px;
}
footer#contact .contact-profile-line{
  color:#829ba5;
  font:11px/1.6 monospace;
  letter-spacing:.04em;
}
@media(max-width:560px){
  footer#contact .contact-profile{
    width:100%;
    max-width:none;
    padding-bottom:8px;
  }
  footer#contact .contact-profile img{
    width:105px;
    height:105px;
    flex-basis:105px;
  }
  footer#contact .contact-profile-title{font-size:17px}
  footer#contact .contact-profile-line{font-size:10px}
}

/* Founder profile — photo directly above the founder's name */
footer#contact .founder-column{
  min-width:300px;
}
footer#contact .founder-column .logo{
  margin-bottom:12px;
}
footer#contact .company-tagline{
  font-size:14px !important;
  line-height:1.55;
  margin:0 0 20px;
}
footer#contact .founder-card{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:7px;
}
footer#contact .founder-card img{
  width:120px;
  height:120px;
  object-fit:cover;
  object-position:center top;
  border:1px solid #315d6c;
  border-radius:7px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
footer#contact .founder-name{
  color:#edf7fa;
  font:800 17px/1.3 Inter,Arial,sans-serif;
  letter-spacing:.01em;
}
footer#contact .founder-role{
  color:var(--a);
  font:800 11px/1.4 monospace;
  letter-spacing:.12em;
}
@media(max-width:560px){
  footer#contact .founder-column{
    min-width:0;
    width:100%;
  }
  footer#contact .founder-card img{
    width:105px;
    height:105px;
  }
  footer#contact .founder-name{
    font-size:16px;
  }
}

function calcRPM(s){const d=num(/(?:dia(?:meter)?|d)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*mm/i,s)||num(/(\d+(?:\.\d+)?)\s*mm\s*(?:cutter|end mill|tool|dia|diameter)/i,s);const vc=num(/(?:vc|cutting speed|speed)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*m\/?min/i,s);if(d)lastDiameter=d;if(vc&&d){lastTopic='rpm';return`RPM ≈ ${Math.round(1000*vc/(Math.PI*d))}
Formula: RPM = (1000 × Vc) / (π × D)
D = ${d} mm, Vc = ${vc} m/min.
Tool maker data aur machine max RPM verify karein.`}return null}
function calcFeed(s){const fz=num(/(?:fz|chip load|feed per tooth)\s*[:=]?\s*(\d+(?:\.\d+)?)/i,s)||lastFz;const z=num(/(?:flute|flutes|teeth|tooth)\s*[:=]?\s*(\d+)/i,s)||lastFlutes;const rpm=num(/(?:rpm|spindle)\s*[:=]?\s*(\d+)/i,s)||lastRPM;if(fz)lastFz=fz;if(z)lastFlutes=z;if(rpm)lastRPM=rpm;if(fz&&z&&rpm){lastTopic='feed';return`Feed ≈ ${Math.round(fz*z*rpm)} mm/min
Formula: Vf = fz × z × RPM
fz=${fz} mm/tooth, teeth=${z}, RPM=${rpm}.`}return null}
function intent(s){let best=null,score=0;for(const [k,re] of DATA){const m=s.match(re);if(m){let sc=(m[0].length/s.length)+0.15;if(sc>score){score=sc;best=k}}}return best}

const FAQ_ITEMS=FAQ.flatMap(([cat,items])=>items.map(x=>({cat,hi:x[0],en:x[1],ahi:x[2],aen:x[3]})));
function renderFAQ(){const cats=document.getElementById('faq-cats'),list=document.getElementById('faq-list');let active=localStorage.getItem('cncveyraFaqCat')||FAQ[0][0];cats.innerHTML='';FAQ.forEach(([cat])=>{const b=document.createElement('button');b.textContent=cat;b.className=cat===active?'active':'';b.onclick=()=>{active=cat;localStorage.setItem('cncveyraFaqCat',cat);renderFAQ()};cats.appendChild(b)});list.innerHTML='';const items=FAQ_ITEMS.filter(x=>x.cat===active);items.forEach(x=>{const b=document.createElement('button');b.textContent=chatLang==='hi'?x.hi:x.en;b.onclick=()=>askFAQ(x);list.appendChild(b)});}
function askFAQ(x){add(chatLang==='hi'?x.hi:x.en,'user');setTimeout(()=>add(chatLang==='hi'?x.ahi:x.aen,'bot'),180)}
function T(hi,en){return chatLang==='hi'?hi:en}
function answer(raw){
 const s=clean(raw); if(!s)return '';
 const exact=FAQ_ITEMS.find(x=>clean(chatLang==='hi'?x.hi:x.en)===s || clean(chatLang==='hi'?x.ahi:x.aen)===s); if(exact) return chatLang==='hi'?exact.ahi:exact.aen;
 if(/^(ok|okay|theek|thik|acha|achha|hmm|hmmm|haan|yes|yep|ji)$/i.test(s)) return T('Bilkul. Aap apna next sawal poochhiye.','Sure. Please ask your next question.');
 const d=detectMaterial(s); if(d) lastMaterial=d;
 let dcalc=calcRPM(s); if(dcalc) return chatLang==='en' ? dcalc.replace('Tool maker data aur machine max RPM verify karein.','Please verify the tool manufacturer data and machine maximum RPM.') : dcalc;
 let fcalc=calcFeed(s); if(fcalc) return chatLang==='en' ? fcalc.replace('Feed ≈','Feed ≈').replace('Formula: Vf = fz × z × RPM','Formula: Vf = fz × z × RPM') : fcalc;
 if(/(?:rpm|spindle).*?(?:nikal|calculate|bata|calculate|tell).*(?:\d+).*mm/i.test(s)||/\d+\s*mm.*(?:rpm|spindle)/i.test(s)) return T('RPM calculate karne ke liye cutter diameter aur cutting speed Vc chahiye. Example: “10 mm cutter, Vc 120 m/min”.','To calculate RPM, I need the cutter diameter and cutting speed Vc. Example: “10 mm cutter, Vc 120 m/min”.');
 if(/(?:feed|feed rate).*?(?:nikal|calculate|bata|tell)/i.test(s)&&!(lastFz&&lastFlutes&&lastRPM)) return T('Feed calculate karne ke liye fz (chip load), flute count aur RPM chahiye. Example: “fz 0.05, 4 flute, 3000 RPM”.','To calculate feed rate, I need fz (chip load), flute count and RPM. Example: “fz 0.05, 4 flute, 3000 RPM”.');
 const it=intent(s);
 switch(it){
 case'greet':return T('Namaste. Main Manmohan Yadav hoon, CNCVEYRA ka virtual assistant. Aap Hindi mein baat kar sakte hain.','Hello. I am Manmohan Yadav, the virtual assistant for CNCVEYRA. You can continue in English.');
 case'about':return T('Mera naam Manmohan Yadav hai. Main CNCVEYRA ka virtual assistant hoon. Main CNC/VMC, CAD/CAM aur mould/design related guidance ke liye yahan hoon.','My name is Manmohan Yadav. I am the virtual assistant for CNCVEYRA. I can help with CNC/VMC, CAD/CAM, mould and design-related questions.');
 case'contact':return `Phone: ${PHONE}\nWhatsApp: ${WA}`;
 case'email':return `Email: ${EMAIL}`;
 case'services':return T('CNCVEYRA CNC/VMC programming, NX CAD/CAM, PowerMill, Mastercam, mould & die, blow mould design aur manufacturing-focused support deta hai.','CNCVEYRA provides CNC/VMC programming, NX CAD/CAM, PowerMill, Mastercam, mould & die, blow mould design and manufacturing-focused support.');
 case'price':return T('Quotation project ki complexity, drawing/3D data, machine, software aur required work par depend karega. Requirement/drawing WhatsApp par bhej sakte hain: '+PHONE,'The quotation depends on project complexity, drawing/3D data, machine, software and scope of work. You can send the requirement/drawing on WhatsApp: '+PHONE);
 case'rpm':return lastDiameter?T(`Aapne ${lastDiameter} mm tool mention kiya hai. RPM nikalne ke liye Vc (m/min) bhi chahiye. Example: “Vc 120 m/min”.`,`You mentioned a ${lastDiameter} mm tool. I also need Vc (m/min) to calculate RPM. Example: “Vc 120 m/min”.`):T('RPM = (1000 × Vc) / (π × D). Tool diameter aur material/operation bata dein, main starting RPM calculate kar dunga.','RPM = (1000 × Vc) / (π × D). Tell me the tool diameter and material/operation and I can calculate a starting RPM.');
 case'vc':return T('Cutting speed Vc = (π × D × RPM) / 1000 m/min. Exact Vc tool geometry, material aur operation par depend karta hai; manufacturer data ko priority dein.','Cutting speed Vc = (π × D × RPM) / 1000 m/min. The exact Vc depends on tool geometry, material and operation; follow the tool manufacturer data first.');
 case'feed':return T('Feed rate Vf = fz × number of teeth × RPM. Cutter diameter, flute count, material aur RPM/fz bata dein to main calculation kar dunga.','Feed rate Vf = fz × number of teeth × RPM. Give me cutter diameter, flute count, material and RPM/fz and I can calculate it.');
 case'doc':return T('Depth of cut tool diameter, material, machine rigidity, stick-out aur roughing/finishing strategy par depend karta hai.','Depth of cut depends on tool diameter, material, machine rigidity, stick-out and the roughing/finishing strategy.');
 case'ae':return T('Step-over (ae) radial engagement hota hai. Roughing aur finishing mein value operation, tool aur material ke hisaab se choose hoti hai.','Step-over (ae) is radial engagement. The value for roughing or finishing depends on the operation, tool and material.');
 case'drill':return T('Drilling RPM = (1000 × Vc)/(π × D). Feed (mm/min) = fn × RPM. Starting values drill manufacturer ke Vc/fn data se lena best hai.','Drilling RPM = (1000 × Vc)/(π × D). Feed (mm/min) = fn × RPM. Start from the drill manufacturer’s recommended Vc/fn data.');
 case'tap':return T('Tapping mein basic feed = RPM × thread pitch (mm/rev) for a single-start thread. Example M10×1.5 at 500 RPM = 750 mm/min.','For a single-start thread, basic tapping feed = RPM × thread pitch (mm/rev). Example: M10×1.5 at 500 RPM = 750 mm/min.');
 case'gcode':return T('Common VMC G-codes: G00 rapid, G01 linear feed, G02/G03 circular interpolation, G17 XY plane, G90 absolute, G91 incremental, G54 work offset. Controller ke hisaab se differences ho sakte hain.','Common VMC G-codes: G00 rapid, G01 linear feed, G02/G03 circular interpolation, G17 XY plane, G90 absolute, G91 incremental, G54 work offset. Controller-specific differences may apply.');
 case'mcode':return T('Common M-codes: M03 spindle CW, M04 CCW, M05 stop, M08 coolant ON, M09 OFF, M30 program end/reset. Exact meaning controller/machine builder se verify karein.','Common M-codes: M03 spindle CW, M04 CCW, M05 stop, M08 coolant ON, M09 OFF, M30 program end/reset. Verify exact meanings for the machine/controller.');
 case'tool':return T('Tool selection material, operation, diameter, flute count, coating, holder/runout aur stick-out par depend karta hai.','Tool selection depends on material, operation, diameter, flute count, coating, holder/runout and stick-out.');
 case'rough':return T('Roughing mein stable tool engagement, chip evacuation aur material removal important hain. Adaptive/trochoidal toolpaths bhi useful ho sakte hain.','For roughing, stable tool engagement, chip evacuation and material removal are important. Adaptive/trochoidal toolpaths can also be useful.');
 case'finish':return T('Finishing mein tool deflection, stepover, feed aur RPM surface finish ko affect karte hain.','In finishing, tool deflection, stepover, feed and RPM affect surface finish.');
 case'cad':return T('CAD side par part modelling, drawing interpretation, design modification, surface/solid preparation aur manufacturing-oriented geometry support kiya ja sakta hai.','CAD support can include part modelling, drawing interpretation, design modification, surface/solid preparation and manufacturing-oriented geometry.');
 case'cam':return T('CAM mein setup, stock, toolpath, simulation/verification, holder collision checking aur post-processing important hain.','CAM involves setup, stock, toolpaths, simulation/verification, holder collision checking and post-processing.');
 case'mould':return T('CNCVEYRA mould & die focused work karta hai, including blow mould design aur CAM programming support.','CNCVEYRA focuses on mould & die work, including blow mould design and CAM programming support.');
 case'axis':return T('3-axis mein X/Y/Z cutting hoti hai. 3+2 mein rotary axes positioning ke liye use hote hain. 4/5-axis strategy machine, kinematics aur post-processor par depend karti hai.','3-axis uses X/Y/Z cutting. In 3+2, rotary axes are used for positioning. 4/5-axis strategy depends on the machine, kinematics and post-processor.');
 case'software':return T('CNCVEYRA ki website par NX CAD/CAM, PowerMill aur Mastercam listed hain.','The CNCVEYRA website lists NX CAD/CAM, PowerMill and Mastercam.');
 case'material':return T(`${lastMaterial||'Material'} machining mein parameters tool geometry, hardness, diameter aur operation ke hisaab se change hote hain.`,`Machining parameters for ${lastMaterial||'the material'} change with tool geometry, hardness, diameter and operation.`);
 case'thanks':return T('Aapka swagat hai.','You are welcome.');
 case'bye':return T('Theek hai. Jab zarurat ho wapas pooch lena. — Manmohan Yadav','Sure. Feel free to ask again whenever you need help. — Manmohan Yadav');
 }
 return T('Main aapki baat samajhne ki koshish karunga. CNC/VMC, CAD/CAM, mould ya machining ke sawal ko normal language mein likhiye.','I will try to understand your question. You can ask normally about CNC/VMC, CAD/CAM, moulds or machining.');
}
function add(t,w){const b=document.getElementById('my-chat-messages'),d=document.createElement('div');d.className='my-msg '+(w==='user'?'my-user':'my-bot');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight}
function ask(q){q=q.trim();if(!q)return;add(q,'user');setTimeout(()=>add(answer(q),'bot'),220)}
const panel=document.getElementById('my-chat-panel');
document.getElementById('my-chat-open').onclick=()=>{panel.classList.add('show');if(!panel.dataset.started){panel.dataset.started='1';add('Namaste. I am Manmohan Yadav. Please choose Hindi or English and continue the conversation.','bot')}};
document.getElementById('my-chat-close').onclick=()=>panel.classList.remove('show');
document.getElementById('my-chat-send').onclick=()=>{const i=document.getElementById('my-chat-text');ask(i.value);i.value='';i.focus()};
document.getElementById('my-chat-text').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('my-chat-send').click()});
document.querySelectorAll('.my-chat-quick button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
// Browser voice. Select a male-sounding voice when the browser provides one.
function pickVoice(lang){
 const voices=window.speechSynthesis.getVoices();
 const male=/male|david|daniel|mark|james|alex|microsoft.*(guy|david|mark)|google.*male/i;
 return voices.find(v=>v.lang.toLowerCase().startsWith(lang) && male.test(v.name)) || voices.find(v=>v.lang.toLowerCase().startsWith(lang)) || voices.find(v=>v.lang.toLowerCase().startsWith('en'));
}
function speakReply(text){
 if(!('speechSynthesis' in window)) return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text.replace(/[•—]/g,' '));
 u.lang=chatLang==='hi'?'hi-IN':'en-IN';
 const v=pickVoice(chatLang==='hi'?'hi':'en'); if(v) u.voice=v;
 u.rate=.92; u.pitch=.72; u.volume=1;
 window.speechSynthesis.speak(u);
}
window.speechSynthesis && window.speechSynthesis.onvoiceschanged && window.speechSynthesis.getVoices();
const mic=document.getElementById('my-chat-mic');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 const rec=new SpeechRecognition(); rec.interimResults=false; rec.continuous=false;
 mic.onclick=()=>{try{rec.lang=chatLang==='hi'?'hi-IN':'en-IN';rec.start();mic.classList.add('listening');}catch(e){}};
 rec.onresult=e=>{const text=e.results[0][0].transcript;document.getElementById('my-chat-text').value=text;ask(text);document.getElementById('my-chat-text').value='';};
 rec.onend=()=>mic.classList.remove('listening'); rec.onerror=()=>mic.classList.remove('listening');
}else{mic.style.display='none';}
const originalAdd=add;
add=function(t,w){originalAdd(t,w);if(w==='bot'&&t)speakReply(t);};
function setLang(l){chatLang=l;document.getElementById('lang-hi').classList.toggle('active',l==='hi');document.getElementById('lang-en').classList.toggle('active',l==='en');document.getElementById('my-chat-text').placeholder=l==='hi'?'Apna sawal likhiye...':'Type your question...';}
document.getElementById('lang-hi').onclick=()=>{setLang('hi');renderFAQ()};
document.getElementById('lang-en').onclick=()=>{setLang('en');renderFAQ()};
renderFAQ();
})();

</script></body></html>
